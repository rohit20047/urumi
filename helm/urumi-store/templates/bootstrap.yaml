{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-bootstrap
data:
  setup.sh: |
    #!/bin/sh
    set -eu
    export WP_CLI_CACHE_DIR=/tmp/wp-cli-cache
    cd /var/www/html
    for attempt in $(seq 1 90); do
      if test -f wp-config.php && wp db check --quiet >/dev/null 2>&1; then break; fi
      sleep 2
    done
    if ! wp core is-installed; then
      wp core install --url="$SITE_URL" --title="$SITE_TITLE" \
        --admin_user="$ADMIN_USER" --admin_password="$ADMIN_PASSWORD" \
        --admin_email="$ADMIN_EMAIL" --skip-email
    fi
    if ! wp plugin is-installed woocommerce; then
      wp plugin install woocommerce --version="$WOOCOMMERCE_VERSION" --activate
    else
      wp plugin activate woocommerce
    fi
    wp rewrite structure '/%postname%/' --hard
    wp eval-file /setup/configure-store.php
    echo 'Store bootstrap complete.'
  configure-store.php: |
    <?php
    if (!class_exists('WooCommerce')) { throw new RuntimeException('WooCommerce not loaded'); }
    WC_Install::create_tables();
    WC_Install::create_pages();
    update_option('timezone_string', 'Asia/Kolkata');
    update_option('woocommerce_currency', 'INR');
    update_option('woocommerce_default_country', 'IN:KA');
    update_option('woocommerce_store_address', 'Demo Store');
    update_option('woocommerce_store_city', 'Bengaluru');
    update_option('woocommerce_store_postcode', '560001');
    update_option('woocommerce_calc_taxes', 'no');
    update_option('woocommerce_enable_guest_checkout', 'yes');
    update_option('woocommerce_coming_soon', 'no');
    update_option('woocommerce_cod_settings', [
      'enabled' => 'yes', 'title' => 'Cash on delivery',
      'description' => 'Test checkout: no online payment is collected.',
      'instructions' => 'Demo order only.', 'enable_for_virtual' => 'yes'
    ]);
    update_option('woocommerce_onboarding_profile', ['completed' => true, 'skipped' => true]);
    update_option('woocommerce_task_list_hidden', 'yes');
    // Classic checkout is sufficient for the assignment and works with COD.
    foreach (['cart' => '[woocommerce_cart]', 'checkout' => '[woocommerce_checkout]',
              'myaccount' => '[woocommerce_my_account]'] as $key => $content) {
      $id = wc_get_page_id($key);
      if ($id > 0) { wp_update_post(['ID' => $id, 'post_content' => $content]); }
    }
    $shop = wc_get_page_id('shop');
    if ($shop > 0) { update_option('show_on_front', 'page'); update_option('page_on_front', $shop); }
    $id = wc_get_product_id_by_sku('URUMI-DEMO-001');
    if (!$id) {
      $product = new WC_Product_Simple();
      $product->set_name('Urumi Demo Notebook');
      $product->set_slug('urumi-demo-notebook');
      $product->set_sku('URUMI-DEMO-001');
      $product->set_regular_price('499');
      $product->set_description('Sample product for the Kubernetes assignment checkout demonstration.');
      $product->set_status('publish');
      $product->set_virtual(true);
      $product->set_stock_status('instock');
      $id = $product->save();
    }
    flush_rewrite_rules(true);
    echo 'Sample product ID: ' . $id . PHP_EOL;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsUser: 33, runAsGroup: 33}
      containers:
        - name: setup
          image: {{ .Values.bootstrap.cliImage | quote }}
          command: [sh, /setup/setup.sh]
          startupProbe:
            exec: {command: [sh, -c, "WP_CLI_CACHE_DIR=/tmp/wp-cli-cache wp db check --quiet >/dev/null 2>&1"]}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [sh, -c, "WP_CLI_CACHE_DIR=/tmp/wp-cli-cache wp db check --quiet >/dev/null 2>&1"]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, "WP_CLI_CACHE_DIR=/tmp/wp-cli-cache wp db check --quiet >/dev/null 2>&1"]}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          env:
            {{- include "urumi.wordpressEnv" . | nindent 12 }}
            - {name: SITE_URL, value: {{ .Values.site.url | quote }}}
            - {name: SITE_TITLE, value: {{ .Values.site.title | quote }}}
            - {name: ADMIN_USER, value: {{ .Values.site.adminUser | quote }}}
            - {name: ADMIN_EMAIL, value: {{ .Values.site.adminEmail | quote }}}
            - {name: WOOCOMMERCE_VERSION, value: {{ .Values.bootstrap.woocommerceVersion | quote }}}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: admin-password}
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - {name: content, mountPath: /var/www/html}
            - {name: setup, mountPath: /setup, readOnly: true}
      volumes:
        - name: content
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-wordpress}
        - name: setup
          configMap: {name: {{ .Release.Name }}-bootstrap}
{{- end }}
