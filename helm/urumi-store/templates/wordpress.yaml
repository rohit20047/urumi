apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wordpress
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-wordpress
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-wordpress
      annotations:
        checksum/config: {{ include "urumi.wordpressEnv" . | sha256sum }}
        checksum/local-loopback: {{ include (print $.Template.BasePath "/local-loopback.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image | quote }}
          ports:
            - {name: http, containerPort: 80}
          env:
            {{- include "urumi.wordpressEnv" . | nindent 12 }}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /wp-login.php, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /wp-includes/images/blank.gif, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - {name: content, mountPath: /var/www/html}
            {{- if .Values.wordpress.localLoopback }}
            - name: local-loopback
              mountPath: /var/www/html/wp-content/mu-plugins/urumi-local-loopback.php
              subPath: urumi-local-loopback.php
              readOnly: true
            {{- end }}
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wordpress
        {{- if .Values.wordpress.localLoopback }}
        - name: local-loopback
          configMap:
            name: {{ .Release.Name }}-local-loopback
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-wordpress
spec:
  selector:
    app: {{ .Release.Name }}-wordpress
  ports:
    - {name: http, port: 80, targetPort: http}
