apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ .Release.Name }}-gateway}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ .Release.Name }}-credentials}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ .Release.Name }}-credentials}
subjects: [{kind: ServiceAccount, name: {{ .Release.Name }}-gateway}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-credentials}
---
# K3s enforces NetworkPolicy. Upstream app ports accept only gateway Pods.
{{ range $role := list "woocommerce" "time" "math" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $.Release.Name }}-{{ $role }}-gateway-only}
spec:
  podSelector:
    matchLabels: {app: {{ $.Release.Name }}-{{ $role }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: {{ $.Release.Name }}-gateway}
      ports: [{protocol: TCP, port: 8000}]
---
{{ end }}
