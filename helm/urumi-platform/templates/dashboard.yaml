apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}-dashboard}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-dashboard}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-dashboard}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dashboard
          image: {{ .Values.dashboardImage | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /, port: http}, periodSeconds: 3, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 15}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata: {name: {{ .Release.Name }}-dashboard}
spec:
  selector: {app: {{ .Release.Name }}-dashboard}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: {{ .Release.Name }}-dashboard}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-gateway, port: {name: http}}}
          - path: /mcp
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-gateway, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-dashboard, port: {name: http}}}
    {{- if .Values.localMcpHost }}
    - host: {{ .Values.localMcpHost | quote }}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-gateway, port: {name: http}}}
    {{- end }}
