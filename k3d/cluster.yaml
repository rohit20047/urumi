apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: urumi-local
servers: 1
agents: 1
image: rancher/k3s:v1.36.5-k3s1
kubeAPI:
  hostIP: "127.0.0.1"
  hostPort: "6550"
ports:
  - port: "127.0.0.1:8080:80"
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: "--node-taint=node-role.kubernetes.io/control-plane=true:NoSchedule"
        nodeFilters:
          - "server:*"
  k3d:
    wait: true
    timeout: "180s"
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
